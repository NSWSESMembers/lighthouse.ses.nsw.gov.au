<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <title>SES Unit/Zone Boundaries - Lighthouse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; font-family: "Open Sans", Arial, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

    .zone-label, .unit-label {
      white-space: nowrap;
      pointer-events: none;
      font-weight: bold;
      text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
      transform: translate(-50%, -50%);
    }
    .zone-label { font-size: 14px; color: #222; }
    .unit-label { font-size: 11px; color: #333; }

    .map-title {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="map-title">Unit/Zone Boundaries Hybrid</div>

  <script>
    const map = L.map('map', {
      center: [-32.0, 147.0],
      zoom: 6,
      minZoom: 5,
      maxZoom: 18
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    // Custom panes referenced by the original layer code.
    // pane-lowest sits below Leaflet's default overlayPane (400) so future overlays can sit above the grid.
    // pane-middle-plus sits above overlayPane so unit/zone labels always render on top of the grid.
    map.createPane('pane-lowest');
    map.getPane('pane-lowest').style.zIndex = 350;
    map.createPane('pane-middle-plus');
    map.getPane('pane-middle-plus').style.zIndex = 450;

    // Deterministic string -> HSL color, so the same zone/unit code always gets the same color.
    function hashToHue(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) % 360;
    }

    function zoneFillColor(zoneCode) {
      return `hsl(${hashToHue('zone-' + zoneCode)}, 55%, 55%)`;
    }

    function colorByUnitCode(unitCode) {
      return `hsl(${hashToHue('unit-' + unitCode)}, 70%, 50%)`;
    }

    function registerSESUnitsZonesHybridGridLayer(map) {
      const layerGroup = L.layerGroup().addTo(map);
      const LABEL_ZOOM_THRESHOLD = 9; // tweak to taste

      const vectorGrid = L.vectorGrid.protobuf(
        'https://map.lighthouse-extension.com/sesunits/tiles/{z}/{x}/{y}.pbf',
        {
          pane: 'pane-lowest',
          vectorTileLayerStyles: {
            'SESUnit_JSON': (props, zoom) => {
              const zoneColor = zoneFillColor(props.ZONECODE);
              const unitColor = colorByUnitCode(props.UNITCODE);

              const useUnitColors = zoom >= LABEL_ZOOM_THRESHOLD;
              const fill = useUnitColors ? unitColor : zoneColor;

              return {
                weight: useUnitColors ? 1 : 1.2,
                color: '#333',
                opacity: 1,
                fill: true,
                fillColor: fill,
                fillOpacity: 0.3
              };
            }
          },
          interactive: true
        });

      layerGroup.addLayer(vectorGrid);

      const zoneLabelLayer = L.geoJSON(null, {
        pointToLayer: (feature, latlng) => {
          const name = feature.properties.ZONENAME;
          return L.marker(latlng, {
            interactive: false,
            pane: 'pane-middle-plus',
            icon: L.divIcon({
              className: 'zone-label',
              html: name,
              iconSize: [0, 0]
            })
          });
        }
      });

      const unitLabelLayer = L.geoJSON(null, {
        pointToLayer: (feature, latlng) => {
          const name = feature.properties.UNITNAME || feature.properties.UNITCODE;

          return L.marker(latlng, {
            interactive: false,
            pane: 'pane-middle-plus',
            icon: L.divIcon({
              className: 'unit-label',
              html: name,
              iconSize: [0, 0]
            })
          });
        }
      });

      // Load unit labels
      fetch('https://map.lighthouse-extension.com/sesunits/labels.geojson')
        .then(r => r.json())
        .then(data => {
          unitLabelLayer.addData(data);
          updateLabelVisibility(LABEL_ZOOM_THRESHOLD);
        });

      // Load zone labels
      fetch('https://map.lighthouse-extension.com/seszones/labels.geojson')
        .then(r => r.json())
        .then(data => {
          zoneLabelLayer.addData(data);
          updateLabelVisibility(LABEL_ZOOM_THRESHOLD);
        });

      function updateLabelVisibility(thres) {
        const z = map.getZoom();

        if (z >= thres - 1) {
          // Zoomed IN -> show UNIT labels, hide ZONE labels
          if (!layerGroup.hasLayer(unitLabelLayer)) layerGroup.addLayer(unitLabelLayer);
          if (layerGroup.hasLayer(zoneLabelLayer)) layerGroup.removeLayer(zoneLabelLayer);
        } else {
          // Zoomed OUT -> show ZONE labels, hide UNIT labels
          if (!layerGroup.hasLayer(zoneLabelLayer)) layerGroup.addLayer(zoneLabelLayer);
          if (layerGroup.hasLayer(unitLabelLayer)) layerGroup.removeLayer(unitLabelLayer);
        }
      }

      map.on('zoomend', () => updateLabelVisibility(LABEL_ZOOM_THRESHOLD));

      return layerGroup;
    }

    registerSESUnitsZonesHybridGridLayer(map);
  </script>
</body>
</html>
