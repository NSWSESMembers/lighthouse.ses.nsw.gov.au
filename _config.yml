# Pages with front matter use _layouts/default.html (or a layout built on it).
# map.html and activity/ have no front matter, so Jekyll copies them through unchanged.
title: Lighthouse
description: Lighthouse is a browser extension, built by NSW SES volunteers, that adds tools and shortcuts to Beacon.

install_url: https://chromewebstore.google.com/detail/lighthouse/eheijalihofgiaoeanmnjceefmcpajnb
install_dev_url: https://chromewebstore.google.com/detail/lighthouse-development-pr/jcmiinngebdojjbcjlpjpdhiankmjbda
facebook_url: https://www.facebook.com/groups/LighthouseExtension/

# Home page headline: one is picked at random on each page load.
# The first is shown if JavaScript is off, so keep it a safe one.
taglines:
  - Beacon, with a few more tools.
  - Do more in Beacon, with less clicking.
  - Beacon, but with fewer tabs open.
  - Making Beacon do things Beacon didn't know it could do.
  - The tool your IC pretends not to rely on.
  - The tools you wished Beacon had, made by people who use it.

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links   # turns [x](page.md) links into page.html

relative_links:
  enabled: true

# guides/lad/ and whats-new/ are synced from docs/ in NSWSESMembers/Lighthouse,
# so their layouts are set here rather than in each file's front matter.
# The stable copies come from master (what users of the Chrome Web Store
# release have). The preview/ copies come from master-dev, for users of
# Lighthouse Development Preview.
#   guide_root: the guide's base URL; layouts use it to list only that copy's pages
#   site_root:  prefix for links to the matching What's New / guide copy
#   lad_guide_data: which _data file holds the "Written for Lighthouse ..." stamp
defaults:
  - scope:
      path: "guides/lad"
    values:
      layout: lad
      title_suffix: LAD User Guide
      guide_root: /guides/lad/
      site_root: ""
      lad_guide_data: lad_guide
  - scope:
      path: "whats-new"
    values:
      layout: whats-new
      site_root: ""
  - scope:
      path: "preview/guides/lad"
    values:
      layout: lad
      title_suffix: LAD User Guide (Dev Preview)
      guide_root: /preview/guides/lad/
      site_root: /preview
      lad_guide_data: lad_guide_preview
      preview: true
  - scope:
      path: "preview/whats-new"
    values:
      layout: whats-new
      site_root: /preview
      preview: true
